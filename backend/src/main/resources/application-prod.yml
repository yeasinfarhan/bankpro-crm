# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET and CORS_ALLOWED_ORIGINS must be set by the host.
spring:
  flyway:
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework   # correct https scheme/IP behind the host's proxy

logging:
  level:
    root: INFO
