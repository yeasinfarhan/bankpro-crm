# Production profile: activate with SPRING_PROFILES_ACTIVE=prod (add ",demo" for the public demo data).
# The host must set: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET (32+ characters), CORS_ALLOWED_ORIGINS.
spring:
  flyway:
    locations: classpath:db/migration
  datasource:
    hikari:
      # Small pool: free database plans allow few connections, and this app needs few.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
      # Managed databases close idle connections; recycle ours before that happens.
      max-lifetime: 600000
      idle-timeout: 300000
      keepalive-time: 120000

server:
  forward-headers-strategy: framework   # correct https scheme/IP behind the host's proxy
  shutdown: graceful
  tomcat:
    threads:
      max: 40                           # fits a 512 MB container

logging:
  level:
    root: INFO
