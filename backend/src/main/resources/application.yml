# Shared settings. Secrets come from environment variables (or a local .env file), never from this file.
spring:
  application:
    name: bankpro
  profiles:
    default: dev
  # Lets you keep local settings in a .env file at the repo root (git-ignored).
  # Real environment variables always win over values in the file.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bankpro?serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:bankpro}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false          # no lazy DB queries while rendering JSON — forces clean service boundaries
    hibernate:
      ddl-auto: validate         # Hibernate checks the schema but never changes it; Flyway does that
    properties:
      hibernate:
        jdbc:
          time_zone: UTC         # store every timestamp in UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  business-zone: Asia/Dhaka
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 60m
    issuer: bankpro
    allow-ephemeral-secret: false   # only the dev profile may run without JWT_SECRET
  login-rate-limit:
    max-failures: 5
    window: 15m

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    # Hibernate logs the full database error text, which repeats the duplicated values (phone, email).
    # GlobalExceptionHandler logs the constraint name instead, so customer data never reaches the logs.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
