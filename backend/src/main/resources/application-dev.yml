# Local development profile (active by default).
spring:
  flyway:
    # Adds synthetic demo data on top of the schema. Never enabled in prod.
    locations: classpath:db/migration,classpath:db/dev

app:
  jwt:
    allow-ephemeral-secret: true    # convenience: random key per run if JWT_SECRET is empty

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.bankpro: DEBUG
